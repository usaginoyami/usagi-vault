name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: |
          set +e
          ./gradlew --no-daemon assembleDebug 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" != "0" ]; then
            # resume os erros como anotação (legível sem baixar o log)
            msg=$(grep -E "^e: |What went wrong|Execution failed|error:|> " build.log | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Build falhou::$msg"
          fi
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: usagi-vault-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Publicar APK na release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          cp app/build/outputs/apk/debug/app-debug.apk UsagiVault-v$VER-debug.apk
          gh release delete "v$VER" --yes --cleanup-tag || true
          gh release create "v$VER" "UsagiVault-v$VER-debug.apk" --target ${{ github.sha }} \
            --title "Usagi Vault v$VER" \
            --notes "APK de teste (debug). Baixe, abra no celular e permita instalar de fontes desconhecidas. Veja o README para as novidades."
